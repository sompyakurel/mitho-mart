name: Check site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check homepage exists
        run: test -f index.html
      - name: Check homepage content
        run: grep -q "Mitho Mart" index.html
