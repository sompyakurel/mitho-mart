name: Deploy to S3
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Deploy index.html to S3
        run: aws s3 cp index.html s3://mitho-mart-portfolio-sompyakurel/index.html --content-type "text/html; charset=utf-8"
      - name: Deploy style.css to S3
        run: aws s3 cp style.css s3://mitho-mart-portfolio-sompyakurel/style.css --content-type "text/css"
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EYR1EFDJSEO2N --paths "/*"
